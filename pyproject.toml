[project]
name = "gliner-test"
version = "0.1.0"
description = "Test drive of GLiNER2.5 NER + relation extraction (CoreML, gliner25-rs, PyTorch) for localdb"
authors = [
    { name = "dokterbob-agent[bot]", email = "4322994+dokterbob-agent[bot]@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "coremltools==9.0",
    "gliner2[local]==2.0.0",
    "huggingface-hub>=0.34,<1",
    "numpy<2.3",
    "protobuf>=5,<7",
    "psutil>=7,<8",
    "sentencepiece>=0.2,<0.3",
    "torch==2.7.0",
    "transformers==4.57.6",
]

[project.scripts]
gliner-test = "gliner_test:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
